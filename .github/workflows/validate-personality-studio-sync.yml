name: Validate Personality Studio Sync

on:
  push:
    branches:
      - dev/personality-studio
    paths:
      - .github/workflows/validate-personality-studio-sync.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/personality-studio
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Generate Studio snapshot
        working-directory: frontend
        run: npm run studio:refresh
      - name: Validate Studio snapshot
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('public/__dev/personality-studio/catalog.json', 'utf8'));
          if (!payload.stats || payload.stats.runtime < 1) throw new Error('No runtime entries');
          if (!payload.stats.staging || payload.stats.staging < 1) throw new Error('No staging entries');
          if (!Array.isArray(payload.axes) || payload.axes.length !== 12) throw new Error('Expected 12 axes');
          if (!payload.personalities.some((p) => p.source === 'staging' && p.id === 'rosa-parks')) throw new Error('Rosa Parks staging entry missing');
          if (!payload.personalities.some((p) => p.source === 'runtime' && p.id === 'bell-hooks')) throw new Error('bell hooks runtime entry missing');
          console.log(JSON.stringify(payload.stats, null, 2));
          NODE
