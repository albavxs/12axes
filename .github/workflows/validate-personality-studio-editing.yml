name: Validate Personality Studio Editing

on:
  push:
    branches:
      - dev/personality-studio
    paths:
      - .github/workflows/validate-personality-studio-editing.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/personality-studio
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Generate snapshot
        working-directory: frontend
        run: npm run studio:refresh
      - name: Validate snapshot and filters data
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('public/__dev/personality-studio/catalog.json','utf8'));
          if (!p.stats || p.stats.runtimeMale < 1 || p.stats.plannedFemale < 1) throw new Error('Missing representation counts');
          if (!p.personalities.some(x => x.representation === 'male')) throw new Error('No male entries');
          if (!p.personalities.some(x => x.representation === 'female')) throw new Error('No female entries');
          if (!p.personalities.some(x => x.source === 'staging')) throw new Error('No staging entries');
          console.log(p.stats);
          NODE
      - name: Start Studio
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:studio -- --host 127.0.0.1 > /tmp/studio.log 2>&1 &
          echo $! > /tmp/studio.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5173/__dev/personality-studio/catalog.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/studio.log
          exit 1
      - name: Test local draft and staging apply
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent -X POST \
            -H 'Content-Type: application/json' \
            -d '{"source":"staging","id":"rosa-parks","draft":{"pt":{"name":"Rosa Parks","role":"Ativista dos direitos civis","category":"ativista","lifespan":"1913–2005","description":"Studio smoke test description."},"en":{"name":"Rosa Parks","role":"Civil rights activist","description":"Studio smoke test description."},"portrait":{"path":"","sourceName":"","sourceUrl":"","note":"","license":"","attribution":""},"book":{"enabled":false,"titlePt":"","titleEn":"","year":""}}}' \
            http://127.0.0.1:5173/__dev/personality-studio-api/draft >/tmp/draft.json
          test -f ../.personality-studio/drafts.json || test -f ../../.personality-studio/drafts.json
          curl --fail --silent -X POST \
            -H 'Content-Type: application/json' \
            -d '{"source":"staging","id":"rosa-parks","draft":{"pt":{"name":"Rosa Parks","role":"Ativista dos direitos civis","category":"ativista","lifespan":"1913–2005","description":"Studio smoke test description."},"en":{"name":"Rosa Parks","role":"Civil rights activist","description":"Studio smoke test description."},"portrait":{"path":"","sourceName":"","sourceUrl":"","note":"","license":"","attribution":""},"book":{"enabled":false,"titlePt":"","titleEn":"","year":""}}}' \
            http://127.0.0.1:5173/__dev/personality-studio-api/apply >/tmp/apply.json
          grep -q 'Studio smoke test description.' ../scripts/data/female-metadata-drafts.json
      - name: Stop Studio
        if: always()
        run: |
          if [ -f /tmp/studio.pid ]; then kill "$(cat /tmp/studio.pid)" || true; fi
