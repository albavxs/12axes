name: Refresh women portraits

on:
  push:
    branches:
      - feat/women-leaders
    paths:
      - .github/workflows/refresh-women-portraits.yml

permissions:
  contents: write

jobs:
  replace-portraits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/women-leaders
          fetch-depth: 0

      - name: Download verified portraits
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/7/7b/Bellhooks.jpg' \
            --output frontend/public/personalities/portraits/bell-hooks.jpg

          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/a/a8/Nizia_Floresta_Augusta_%28Mulheres_illustres_do_Brazil%29.jpg' \
            --output frontend/public/personalities/portraits/nisia-floresta.jpg

          test "$(file --brief --mime-type frontend/public/personalities/portraits/bell-hooks.jpg)" = "image/jpeg"
          test "$(file --brief --mime-type frontend/public/personalities/portraits/nisia-floresta.jpg)" = "image/jpeg"
          test -s frontend/public/personalities/portraits/bell-hooks.jpg
          test -s frontend/public/personalities/portraits/nisia-floresta.jpg

      - name: Commit portrait replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/public/personalities/portraits/bell-hooks.jpg \
            frontend/public/personalities/portraits/nisia-floresta.jpg
          git diff --cached --quiet && exit 0
          git commit -m "fix(assets): replace bell hooks and Nisia Floresta portraits"
          git push origin HEAD:feat/women-leaders
